<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">ATP and energy transfer</title>
  <desc id="desc">A simplified diagram showing ATP becoming ADP plus inorganic phosphate, with energy available for cellular work.</desc>
  <rect width="600" height="260" rx="22" fill="#F4F1DE"/>
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0B3D3A">ATP and energy transfer</text>
  <rect x="52" y="78" width="135" height="70" rx="14" fill="#0B3D3A"/>
  <text x="119" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">ATP</text>
  <path d="M205 112 H270" stroke="#2A9D8F" stroke-width="7" stroke-linecap="round"/>
  <path d="M256 98 L274 112 L256 126" fill="none" stroke="#2A9D8F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="292" y="78" width="112" height="70" rx="14" fill="#2A9D8F"/>
  <text x="348" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">ADP</text>
  <text x="421" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#19312F">+</text>
  <circle cx="468" cy="112" r="28" fill="#E9C46A" stroke="#0B3D3A" stroke-width="2"/>
  <text x="468" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#19312F">Pi</text>
  <path d="M300 166 V185 H420" fill="none" stroke="#E76F51" stroke-width="3" stroke-linecap="round"/>
  <path d="M410 176 L422 185 L410 194" fill="none" stroke="#E76F51" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#19312F">Energy can be coupled to cellular work</text>
  <text x="300" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#19312F">Simplified concept diagram — not to scale</text>
</svg>
