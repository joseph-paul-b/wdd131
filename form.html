<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form for sharing feedback about a product.">
    <meta name="author" content="Joseph Paul">
    <title>Product Review Form | Joseph Paul</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

```
<main>
    <form method="get" action="review.html">
        <h2>Product Review Form</h2>

        <p class="required-note">* Indicates a required field</p>

        <div class="form-group">
            <label for="product">Product Name <span class="required">*</span></label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>
        </div>

        <fieldset>
            <legend>Overall Rating <span class="required">*</span></legend>

            <div class="rating">
                <label for="rating1">
                    <input type="radio" id="rating1" name="rating" value="1" required>
                    ☆
                </label>

                <label for="rating2">
                    <input type="radio" id="rating2" name="rating" value="2" required>
                    ☆☆
                </label>

                <label for="rating3">
                    <input type="radio" id="rating3" name="rating" value="3" required>
                    ☆☆☆
                </label>

                <label for="rating4">
                    <input type="radio" id="rating4" name="rating" value="4" required>
                    ☆☆☆☆
                </label>

                <label for="rating5">
                    <input type="radio" id="rating5" name="rating" value="5" required>
                    ☆☆☆☆☆
                </label>
            </div>
        </fieldset>

        <div class="form-group">
            <label for="install-date">Date of Installation <span class="required">*</span></label>
            <input type="date" id="install-date" name="install-date" required>
        </div>

        <fieldset>
            <legend>Which features did you find useful?</legend>

            <label for="durability">
                <input type="checkbox" id="durability" name="features" value="durability">
                Durability
            </label>

            <label for="ease-of-use">
                <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
                Ease of Use
            </label>

            <label for="performance">
                <input type="checkbox" id="performance" name="features" value="performance">
                Performance
            </label>

            <label for="design">
                <input type="checkbox" id="design" name="features" value="design">
                Design
            </label>
        </fieldset>

        <div class="form-group">
            <label for="review">Written Review</label>
            <textarea id="review" name="review"></textarea>
        </div>

        <div class="form-group">
            <label for="user-name">Your Name</label>
            <input type="text" id="user-name" name="user-name">
        </div>

        <input type="submit" value="Submit Review">
    </form>
</main>

<footer>
    <p>&copy; <span id="currentyear"></span> Joseph Paul | Nigeria</p>
    <p id="lastModified"></p>
</footer>


</body>
</html>
